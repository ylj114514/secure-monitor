# Grafana Dashboard 自动加载配置
# Grafana 会扫描 /var/lib/grafana/dashboards 并自动加载 JSON。

apiVersion: 1

providers:
  - name: SecureMonitor Dashboards
    orgId: 1
    folder: SecureMonitor
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
