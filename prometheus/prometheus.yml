# Prometheus 主配置文件
#
# 本项目用 Prometheus 统一抓取各类 Exporter 和 demo-app 暴露的指标。
# static_configs 用于固定服务发现；file_sd_configs 用于文件型动态服务发现；
# rule_files 加载告警规则；alerting 将告警发送给 Alertmanager。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/host_alerts.yml
  - /etc/prometheus/rules/container_alerts.yml
  - /etc/prometheus/rules/service_alerts.yml
  - /etc/prometheus/rules/security_alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          monitor_type: prometheus

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          monitor_type: host

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          monitor_type: container

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          monitor_type: alerting

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115
        labels:
          monitor_type: probe_exporter

  - job_name: dynamic-file-sd
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/targets.json
        refresh_interval: 15s

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://demo-app:5000/health
        labels:
          monitor_type: service_probe
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
