# SecureMonitor OS Docker Compose 主部署文件
#
# 该文件启动监控基础设施和统一可视化控制台：
# Prometheus、Grafana、Alertmanager、node-exporter、cAdvisor、
# blackbox-exporter、security-exporter、demo-app、console-backend、
# console-frontend。

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: secure-monitor-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/file_sd:/etc/prometheus/file_sd:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    depends_on:
      - alertmanager
      - node-exporter
      - cadvisor
      - blackbox-exporter
      - security-exporter
      - demo-app
    networks:
      - secure-monitor-net

  grafana:
    image: grafana/grafana:latest
    container_name: secure-monitor-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Shanghai
      # 仅用于本地课程演示的 iframe 嵌入；生产环境应重新评估认证和安全策略。
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_METRICS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - secure-monitor-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: secure-monitor-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - secure-monitor-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: secure-monitor-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      # Docker Desktop/WSL2 下 rslave 挂载传播可能不可用，课程演示使用只读根文件系统挂载。
      - /:/host:ro
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$"
    networks:
      - secure-monitor-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: secure-monitor-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - secure-monitor-net

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: secure-monitor-blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    networks:
      - secure-monitor-net

  security-exporter:
    build:
      context: ./exporters/security_exporter
      dockerfile: Dockerfile
    container_name: secure-monitor-security-exporter
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - secure-monitor-net

  demo-app:
    build:
      context: ./demo-app
      dockerfile: Dockerfile
    container_name: secure-monitor-demo-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - secure-monitor-net

  console-backend:
    build:
      context: ./console-backend
      dockerfile: Dockerfile
    container_name: secure-monitor-console-backend
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      ALERTMANAGER_URL: http://alertmanager:9093
      GRAFANA_URL: http://grafana:3000
      GRAFANA_PUBLIC_URL: http://127.0.0.1:3000
      SECURITY_EXPORTER_URL: http://security-exporter:8000
      DEMO_APP_URL: http://demo-app:5000
    depends_on:
      - prometheus
      - alertmanager
      - grafana
      - security-exporter
      - demo-app
    networks:
      - secure-monitor-net

  console-frontend:
    build:
      context: ./console-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:7000
    container_name: secure-monitor-console-frontend
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:7000
    depends_on:
      - console-backend
    networks:
      - secure-monitor-net

networks:
  secure-monitor-net:
    name: secure-monitor-net
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
