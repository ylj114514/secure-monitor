# SecureMonitor Docker Compose 主部署文件
#
# 一键启动课程设计演示所需的核心监控服务：
# Prometheus、Grafana、Alertmanager、node-exporter、cAdvisor、
# blackbox-exporter、security-exporter 和 demo-app。
#
# Windows / Docker Desktop / WSL2 环境下，cAdvisor 和 node-exporter 的主机目录
# 挂载能力可能受 Docker Desktop 文件共享与 Linux VM 限制影响，详见 README。

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: secure-monitor-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Prometheus 主配置文件，包含 scrape_configs、规则文件和 Alertmanager 地址。
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 告警规则目录，后续按主机、容器、服务、安全指标分类维护。
      - ./prometheus/rules:/etc/prometheus/rules:ro
      # 文件型动态服务发现目录，用于演示 file_sd_configs。
      - ./prometheus/file_sd:/etc/prometheus/file_sd:ro
      # Prometheus 时序数据持久化，避免容器重启后数据立即丢失。
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    depends_on:
      - alertmanager
      - node-exporter
      - cadvisor
      - blackbox-exporter
      - security-exporter
      - demo-app
    networks:
      - secure-monitor-net

  grafana:
    image: grafana/grafana:latest
    container_name: secure-monitor-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 课程演示环境使用默认管理员账号；生产环境应改为强密码或外部密钥。
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Grafana provisioning：自动配置数据源和 Dashboard 加载规则。
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON 文件目录。
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Grafana 本地数据持久化。
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - secure-monitor-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: secure-monitor-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      # Alertmanager 告警路由与接收器配置。
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - secure-monitor-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: secure-monitor-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      # 以只读方式挂载宿主机根文件系统，用于采集主机 CPU、内存、磁盘、网络等指标。
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"
      # 排除容器运行时和临时文件系统，减少无意义磁盘指标。
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$"
    networks:
      - secure-monitor-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: secure-monitor-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      # cAdvisor 需要访问宿主机和 Docker 运行目录来采集容器资源指标。
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - secure-monitor-net

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: secure-monitor-blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      # blackbox_exporter 探测模块配置，后续用于 HTTP 可用性监控。
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    networks:
      - secure-monitor-net

  security-exporter:
    build:
      context: ./exporters/security_exporter
      dockerfile: Dockerfile
    container_name: secure-monitor-security-exporter
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - secure-monitor-net

  demo-app:
    build:
      context: ./demo-app
      dockerfile: Dockerfile
    container_name: secure-monitor-demo-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - secure-monitor-net

networks:
  secure-monitor-net:
    name: secure-monitor-net
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
